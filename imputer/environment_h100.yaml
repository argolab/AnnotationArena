name: marformer_h100

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.13.1
  - pip

  # Core scientific stack (conda-managed for speed)
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7

  - pip:
      # PyTorch 2.5.1 — first release with full Python 3.13 support, CUDA 12.1 build
      - torch==2.5.1+cu121 --index-url https://download.pytorch.org/whl/cu121
      - torchvision==0.20.1+cu121 --index-url https://download.pytorch.org/whl/cu121

      # Lightning + logging
      - pytorch-lightning==2.4.0
      - tensorboard>=2.14

      # STAN inference
      - cmdstanpy>=1.2
